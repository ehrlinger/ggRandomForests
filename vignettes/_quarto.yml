format:
  html:
    # House layout, shared with the Quarto books and the hvtiRtemplates jobs:
    # table of contents on the left, body across the window. Quarto merges
    # these options into each vignette's own format: block. pkgdown replaces
    # the format with its own template, so the site gets the same layout from
    # pkgdown/extra.css instead.
    toc: true
    toc-location: left
    page-layout: full
    grid:
      body-width: 2000px
      sidebar-width: 250px
