# Builds the PDF manual (--as-cran, no --no-manual) so raw Unicode in .Rd
# files (Greek letters, β̂, combining marks) is caught here rather than at
# CRAN submission, where --no-manual would otherwise let it through in
# silence. Runs on pushes to the default branch, not on pull requests,
# because building the manual is slow and a check that makes every PR wait
# is one people learn to route around.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: Check manual

permissions:
  contents: read

jobs:
  check-manual:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      VDIFFR_RUN_TESTS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # No --no-manual anywhere: TinyTeX is only worth installing if the
          # manual it builds is actually checked.
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'
