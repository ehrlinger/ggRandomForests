# CRAN submission pre-flight check.
# Runs the full --as-cran gauntlet, manual included, on a published GitHub
# release tag. Mirrors what CRAN's win-builder and macOS builders will do.
#
# Trigger manually via workflow_dispatch or automatically on release publication.
on:
  release:
    types: [published]
  workflow_dispatch:
  # Weekly, Sundays 06:00 UTC, so R-devel changes, Windows breaks and creep
  # toward CRAN's 10-minute check budget surface between releases, not on
  # submission day.
  schedule:
    - cron: '0 6 * * 0'

name: check-release.yaml

permissions: read-all

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. Protected branches
  # are exempt, so a release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

jobs:
  cran-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) [--as-cran]

    strategy:
      fail-fast: false
      matrix:
        config:
          # Mirror the platforms CRAN actually checks
          - {os: windows-latest,  r: 'release'}
          - {os: windows-latest,  r: 'devel'}
          - {os: windows-latest,  r: 'oldrel-1'}
          - {os: macos-latest,    r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_: true
      # The root .Renviron defaults VDIFFR_RUN_TESTS to true, and R reads it
      # from the checkout. This job checks the built tarball, which has no
      # tests/testthat/_snaps (.Rbuildignore), so every vdiffr test would
      # record a new snapshot and fail. The other workflows set it the same way.
      VDIFFR_RUN_TESTS: "false"
      _R_CHECK_CRAN_INCOMING_REMOTE_: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # TinyTeX-1, the default bundle, lacks the Courier metrics (pcrr8t) the
      # manual needs under times/inconsolata; without them the PDF manual fails
      # with "\textfont 0 is undefined" on Windows and R-devel (run
      # 38269008793). makeindex is missing too. The TinyTeX bundle carries both,
      # so no leg needs tlmgr: installing them with tlmgr broke twice, first on
      # "tlmgr itself needs to be updated" (run 40987215523, every leg), then
      # with Windows hanging while extracting courier (run 41015118970).
      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX

      # A missing file used to surface only as a manual failure much later, and
      # on Windows a failed tlmgr left its step green, so check the files here.
      - name: Check the LaTeX files the manual needs
        shell: pwsh
        run: |
          if (-not (kpsewhich pcrr8t.tfm)) { throw "Courier metrics (pcrr8t.tfm) not found" }
          if (-not (Get-Command makeindex -ErrorAction SilentlyContinue)) { throw "makeindex not found" }

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Upload check/ on success as well as failure: 00check.log carries
          # per-step timings, and the passing runs are the ones worth trending
          # against the CRAN check-time budget.
          upload-results: true
          # No --no-manual anywhere: this is the one workflow where TinyTeX
          # is actually exercised, so the PDF manual is genuinely built.
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'

  # The release gate runs urlchecker::url_check(); this runs it weekly too, so
  # a dead link turns up between releases rather than in CRAN's incoming check.
  url-check:
    runs-on: ubuntu-latest
    name: urlchecker
    steps:
      - uses: actions/checkout@v4

      # url_check() renders README.md and the vignettes through pandoc to
      # find their links; without it the job aborts before checking any.
      - uses: r-lib/actions/setup-pandoc@v2

      # The vignettes are .qmd, and url_check() reads their links through the
      # quarto CLI, not only the quarto R package.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # urlchecker needs curl. When a curl release has no Posit binary yet,
      # install.packages() builds it from source, which needs the libcurl
      # headers (v4.0.0-rc9's run failed on curl 8.1.0 for want of them).
      - name: Install libcurl headers
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Check URLs
        shell: Rscript {0}
        run: |
          # url_check() refuses to scan vignettes unless the package's
          # VignetteBuilder is installed, so install it from DESCRIPTION.
          vb <- read.dcf("DESCRIPTION", fields = "VignetteBuilder")[1, 1]
          vb <- if (is.na(vb)) character() else trimws(strsplit(vb, ",")[[1]])
          install.packages(c("urlchecker", vb))
          res <- urlchecker::url_check(fail = FALSE)
          print(res)
          # url_check() allows each host 5 seconds, and r-project.org can take
          # 15 (run 41039560804). A timeout says the host was slow, not that the
          # link is dead, so it warns here; anything else still fails the job,
          # including a defect in the other columns of a row that timed out.
          timed_out <- grepl("Timeout was reached", res$Message, fixed = TRUE) &
            !nzchar(res$New) & !nzchar(res$CRAN) &
            !nzchar(res$Spaces) & !nzchar(res$R)
          for (url in unique(res$URL[timed_out])) {
            cat("::warning::URL timed out, not verified:", url, "\n")
          }
          if (!all(timed_out)) stop(sum(!timed_out), " URL problem(s); see above.")
